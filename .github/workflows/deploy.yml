name: Deploy to Cloud Run (prod)

# 운영 배포는 자동으로 실행되지 않습니다.
# staging 검증 완료 후 Actions 탭에서 이 워크플로를 수동 실행(workflow_dispatch)하고,
# staging 배포 시 발급된 이미지 태그(예: staging-abc1234)를 입력하면
# 재빌드 없이 검증된 이미지가 그대로 운영에 배포됩니다.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Staging에서 검증 완료된 이미지 태그 (예: staging-abc1234)"
        required: true
        type: string

env:
  IMAGE_BASE: asia-northeast3-docker.pkg.dev/blinker-backend1/blinker-repo/blinker-backend1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:

    - name: Note Build Start Time
      id: start_time
      run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

    - name: 1️⃣ Authenticate with GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: "${{ secrets.GCP_SA_KEY }}"

    - name: 2️⃣ 승격 대상 이미지 존재 확인
      run: |
        gcloud artifacts docker images describe \
          $IMAGE_BASE:${{ inputs.image_tag }} \
          --format="value(image_summary.digest)"

    - name: 3️⃣ Deploy to Cloud Run (prod)
      run: |
        gcloud run deploy blinker-backend1 \
          --image=$IMAGE_BASE:${{ inputs.image_tag }} \
          --platform=managed \
          --vpc-connector=my-connector \
          --vpc-egress=all-traffic \
          --region=asia-northeast3 \
          --allow-unauthenticated \
          --add-cloudsql-instances=blinker-db:asia-northeast3:blinker-atom-db \
          --set-env-vars "SPRING_PROFILES_ACTIVE=prod,THINGPLUG_URL=http://thingplugpf.sktiot.com:9000,GOOGLE_APPLICATION_CREDENTIALS=/app/blinker-backend-key.json,THINGPLUG_UKEY=${{ secrets.THINGPLUG_UKEY }},JWT_SECRET=${{ secrets.JWT_SECRET }},KAKAO_REST_KEY=${{ secrets.KAKAO_REST_KEY }},DISCORD_WEBHOOK=${{ secrets.DISCORD_WEBHOOK }},DB_PASSWORD=${{ secrets.DB_PASSWORD }}"

    # 한 번이라도 --no-traffic 카나리를 만들면 Cloud Run은 이후 deploy에서도 기존 트래픽 배분을 유지한다.
    # 워크플로 성공이 실제 운영 승격을 의미하도록 최신 준비 완료 리비전으로 명시적으로 전환한다.
    - name: 4️⃣ Route Production Traffic to Latest Revision
      run: |
        gcloud run services update-traffic blinker-backend1 \
          --region=asia-northeast3 \
          --to-latest

    - name: 종료 시간 기록
      id: end_time
      run: |
        echo "END_TIME=$(date +%s)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(( $(date +%s) - $START_TIME ))" >> $GITHUB_ENV

    - name: 배포 실패 시 종료 시간 기록
      if: failure()
      run: |
        echo "END_TIME=$(date +%s)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(( $(date +%s) - $START_TIME ))" >> $GITHUB_ENV

    - name: 빌드 실패 Discord 알림
      if: failure()
      uses: tsickert/discord-webhook@v6.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        embed-title: "🌋 **배포 실패.**"
        embed-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        embed-description: |
          𝑒 **배포 환경:** `prod`
          𝘣 **이미지 태그:** `${{ inputs.image_tag }}`
          𝑡 **소요 시간:** `${{ env.BUILD_TIME }}초`
          𝒈 **액션 링크:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        embed-color: "16711680"

    - name: 빌드 성공 Discord 알림
      if: success()
      uses: tsickert/discord-webhook@v6.0.0
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        embed-title: "✅ **배포 성공.**"
        embed-url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        embed-description: |
          𝑒 **배포 환경:** `prod`
          𝘣 **이미지 태그:** `${{ inputs.image_tag }}`
          𝑡 **소요 시간:** `${{ env.BUILD_TIME }}초`
          𝒈 **액션 링크:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        embed-color: "3066993"
